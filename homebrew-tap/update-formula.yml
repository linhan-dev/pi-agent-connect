name: update-formula

on:
  workflow_dispatch:
  repository_dispatch:
    types: [release]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/update-formula.sh

      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/pi-agent-connect.rb
          if git diff --cached --quiet; then
            echo "no formula changes"
          else
            version="$(sed -n 's/.*version "\(.*\)".*/\1/p' Formula/pi-agent-connect.rb)"
            git commit -m "Update pi-agent-connect formula to ${version}"
            git push
          fi
