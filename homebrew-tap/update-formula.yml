name: update-formula

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/update-formula.sh

      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/pico.rb
          if git diff --cached --quiet; then
            echo "no formula changes"
          else
            version="$(sed -n 's/.*version "\(.*\)".*/\1/p' Formula/pico.rb)"
            git commit -m "Update pi-agent-connect formula to ${version}"
            git push
          fi
